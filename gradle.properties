# Gradle JVM Memory Allocation (Fixes Out of Memory heap exhaustion)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Kotlin Daemon Memory Allocation
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Android & Build Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
